<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>마감 구출 작전 - 타임테이블 & 알람</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @keyframes pulse-fast {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.03); }
    }
    .energy-btn {
      animation: pulse-fast 2s infinite ease-in-out;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background-color: #93c5fd;
      border-radius: 3px;
    }
  </style>
</head>
<body class="bg-blue-50 text-slate-800 min-h-screen flex flex-col font-sans">

  <!-- Header -->
  <header class="bg-blue-600 text-white py-4 px-6 shadow-md flex items-center justify-between">
    <div class="flex items-center space-x-3">
      <i class="fa-solid fa-bolt text-yellow-300 text-2xl"></i>
      <h1 class="text-xl font-bold tracking-wide">마감 구출 작전 (Deadline Runner)</h1>
    </div>
    <span class="text-xs bg-blue-500 px-3 py-1 rounded-full text-blue-100 font-medium">
      <i class="fa-regular fa-bell mr-1"></i>시간별 실시간 알림 지원
    </span>
  </header>

  <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 flex flex-col gap-6">

    <!-- 1. 상단 입력창 -->
    <section class="bg-white p-6 rounded-2xl shadow-sm border border-blue-100 transition-all">
      <form id="planForm" class="flex flex-col md:flex-row gap-4 items-end">
        <div class="flex-1 w-full">
          <label class="block text-sm font-semibold text-blue-900 mb-1">
            <i class="fa-solid fa-fire text-red-500 mr-1"></i>미루고 있는 작업
          </label>
          <input type="text" id="taskInput" required 
            placeholder="예: 파이썬 과제 완료하기, 보고서 초안 작성, 3D 모델링 완성" 
            class="w-full px-4 py-3 rounded-xl border border-blue-200 focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
        </div>

        <div class="w-full md:w-64">
          <label class="block text-sm font-semibold text-blue-900 mb-1">
            <i class="fa-solid fa-clock text-blue-500 mr-1"></i>최종 마감 기한
          </label>
          <input type="datetime-local" id="deadlineInput" required 
            class="w-full px-4 py-3 rounded-xl border border-blue-200 focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
        </div>

        <button type="submit" id="submitBtn" 
          class="w-full md:w-auto px-8 py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-lg hover:shadow-blue-200 transition-all flex items-center justify-center space-x-2 energy-btn whitespace-nowrap">
          <i class="fa-solid fa-rocket"></i>
          <span>지금 바로 시작하기!</span>
        </button>
      </form>
    </section>

    <!-- 2. 하단 출력창 (2분할 레이아웃) -->
    <section class="flex-1 grid grid-cols-1 lg:grid-cols-2 gap-6 min-h-[500px]">

      <!-- 왼쪽: 타임테이블 -->
      <div class="bg-white rounded-2xl shadow-sm border border-blue-100 p-6 flex flex-col">
        <div class="flex items-center justify-between pb-4 mb-4 border-b border-blue-100">
          <h2 class="text-lg font-bold text-blue-900 flex items-center gap-2">
            <i class="fa-solid fa-list-check text-blue-600"></i>
            시간대별 마감 타임테이블
          </h2>
          <span id="alarmStatus" class="text-xs text-slate-400">알림 대기 중</span>
        </div>

        <div id="scheduleContainer" class="flex-1 overflow-y-auto custom-scrollbar pr-2 space-y-4">
          <!-- 대기 상태 가이드 -->
          <div class="h-full flex flex-col items-center justify-center text-slate-400 py-12">
            <i class="fa-regular fa-calendar-check text-5xl mb-3 text-blue-200"></i>
            <p>위에서 미룬 일과 마감 시간을 입력해보세요.</p>
            <p class="text-xs text-slate-400 mt-1">Gemini가 최적의 시간표를 짜드립니다!</p>
          </div>
        </div>
      </div>

      <!-- 오른쪽: 텍스트 설명 & 동기부여 -->
      <div class="bg-white rounded-2xl shadow-sm border border-blue-100 p-6 flex flex-col">
        <div class="flex items-center justify-between pb-4 mb-4 border-b border-blue-100">
          <h2 class="text-lg font-bold text-blue-900 flex items-center gap-2">
            <i class="fa-solid fa-bullseye text-blue-600"></i>
            마감 돌파 전략 & 코칭
          </h2>
        </div>

        <div id="overviewContainer" class="flex-1 overflow-y-auto custom-scrollbar space-y-6">
          <!-- 대기 상태 -->
          <div class="h-full flex flex-col items-center justify-center text-slate-400 py-12">
            <i class="fa-solid fa-heart-pulse text-5xl mb-3 text-blue-200"></i>
            <p>당신의 목표 달성을 위한 에너지가 여기서 장전됩니다.</p>
          </div>
        </div>
      </div>

    </section>
  </main>

  <script>
    // 현재 날짜/시간을 datetime-local 기본값으로 세팅 (최소 2시간 뒤 마감으로 설정)
    const deadlineInput = document.getElementById('deadlineInput');
    const now = new Date();
    now.setHours(now.getHours() + 2);
    deadlineInput.value = now.toISOString().slice(0, 16);

    let activeAlarms = [];
    let alarmCheckInterval = null;

    // 브라우저 알림 권한 요청
    if ("Notification" in window && Notification.permission !== "granted") {
      Notification.requestPermission();
    }

    document.getElementById('planForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const task = document.getElementById('taskInput').value;
      const deadline = deadlineInput.value;
      const submitBtn = document.getElementById('submitBtn');

      // 로딩 상태 UI
      submitBtn.disabled = true;
      submitBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> <span>타임테이블 생성 중...</span>`;

      try {
        const response = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ task, deadline })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || '생성 실패');
        }

        renderSchedule(data.schedule);
        renderOverview(data.motivational_message, data.strategy_summary);
        setupAlarms(data.schedule);

      } catch (err) {
        alert(err.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = `<i class="fa-solid fa-rocket"></i> <span>지금 바로 시작하기!</span>`;
      }
    });

    // 왼쪽 타임테이블 렌더링
    function renderSchedule(schedule) {
      const container = document.getElementById('scheduleContainer');
      container.innerHTML = '';

      schedule.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = "flex gap-4 p-4 rounded-xl border border-blue-100 bg-blue-50/50 hover:bg-blue-50 transition relative overflow-hidden";
        card.id = `schedule-item-${index}`;

        card.innerHTML = `
          <div class="flex flex-col items-center justify-center bg-blue-600 text-white font-bold rounded-lg px-3 py-2 min-w-[70px] text-center shadow-sm">
            <span class="text-sm"><i class="fa-regular fa-clock text-xs block mb-1"></i>${item.time}</span>
          </div>
          <div class="flex-1">
            <h3 class="font-bold text-slate-800 text-base">${item.title}</h3>
            <p class="text-sm text-slate-600 mt-1 leading-relaxed">${item.detail}</p>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // 오른쪽 설명 및 동기부여 렌더링
    function renderOverview(motivation, strategy) {
      const container = document.getElementById('overviewContainer');
      container.innerHTML = `
        <div class="bg-gradient-to-br from-blue-600 to-indigo-600 text-white p-5 rounded-xl shadow-md space-y-2">
          <div class="flex items-center gap-2 text-yellow-300 font-bold text-sm">
            <i class="fa-solid fa-bolt"></i>
            <span>할 수 있다! 마감 파워 코칭</span>
          </div>
          <p class="text-base font-semibold leading-relaxed">${motivation}</p>
        </div>

        <div class="bg-white p-5 rounded-xl border border-blue-200 shadow-sm space-y-3">
          <h3 class="font-bold text-blue-950 flex items-center gap-2">
            <i class="fa-solid fa-chess-knight text-blue-600"></i>
            핵심 진행 전략
          </h3>
          <p class="text-sm text-slate-700 leading-relaxed whitespace-pre-line">${strategy}</p>
        </div>
      `;
    }

    // 시간대별 실시간 알림 로직
    function setupAlarms(schedule) {
      if (alarmCheckInterval) clearInterval(alarmCheckInterval);
      activeAlarms = schedule.map(item => ({ ...item, triggered: false }));

      document.getElementById('alarmStatus').textContent = "🔔 알림 활성화됨";
      document.getElementById('alarmStatus').className = "text-xs text-blue-600 font-bold animate-pulse";

      // 10초마다 현재 시간 체크
      alarmCheckInterval = setInterval(() => {
        const now = new Date();
        const currentHHMM = now.toTimeString().slice(0, 5);

        activeAlarms.forEach((alarm, index) => {
          if (alarm.time === currentHHMM && !alarm.triggered) {
            alarm.triggered = true;
            triggerNotification(alarm.title, alarm.detail);
            
            // 타임테이블 카드 강조 효과
            const card = document.getElementById(`schedule-item-${index}`);
            if (card) {
              card.classList.remove('bg-blue-50/50');
              card.classList.add('bg-yellow-100', 'border-yellow-400', 'scale-[1.02]');
            }
          }
        });
      }, 10000);
    }

    // 브라우저 데스크톱 알림 및 사운드
    function triggerNotification(title, body) {
      if ("Notification" in window && Notification.permission === "granted") {
        new Notification(`⏰ [마감 알림] ${title}`, {
          body: body,
          icon: 'https://cdn-icons-png.flaticon.com/512/1827/1827312.png'
        });
      } else {
        alert(`⏰ [마감 알림] ${title}\n\n${body}`);
      }
    }
  </script>
</body>
</html>
