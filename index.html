<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>통합 게시판 및 상태 관리 시스템</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
      background-color: #f4f7f6;
      color: #333;
    }
    h1, h2 {
      color: #2c3e50;
    }
    .board-card {
      background: #ffffff;
      padding: 24px;
      margin-bottom: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }
    form {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    input[type="text"], textarea, select {
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
    }
    input[type="text"] {
      flex: 1;
    }
    textarea {
      width: 100%;
      height: 80px;
      resize: vertical;
    }
    button {
      padding: 10px 20px;
      background-color: #3498db;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }
    button:hover {
      background-color: #2980b9;
    }
    .post-item, .todo-item {
      padding: 14px;
      margin-bottom: 10px;
      border-radius: 8px;
      background: #fafafa;
      border: 1px solid #eee;
    }
    .post-item h3 {
      margin: 0 0 8px 0;
      font-size: 1.1em;
    }
    .post-item p {
      margin: 0 0 6px 0;
      color: #555;
    }
    .post-item small, .todo-date {
      font-size: 0.8em;
      color: #888;
    }
    .badge {
      padding: 4px 8px;
      border-radius: 4px;
      font-weight: bold;
      color: white;
      font-size: 0.85em;
    }
    .badge-complete { background-color: #2ecc71; }
    .badge-incomplete { background-color: #e67e22; }
  </style>
</head>
<body>

  <h1>🚀 프로젝트 관리 & 게시판</h1>

  <!-- ================= 1번 게시판 (일반 게시판) ================= -->
  <div class="board-card">
    <h2>📋 일반 게시판</h2>
    <form id="post-form">
      <input type="text" id="post-title" placeholder="게시글 제목을 입력하세요" required style="width: 100%;">
      <textarea id="post-content" placeholder="게시글 내용을 입력하세요" required></textarea>
      <button type="submit">글 등록</button>
    </form>
    <div id="post-list">
      <!-- 1번 게시판 목록이 그려지는 곳 -->
    </div>
  </div>

  <!-- ================= 2번 게시판 (상태 관리 게시판) ================= -->
  <div class="board-card">
    <h2>📌 상태 관리 게시판 (완료/미완료)</h2>
    
    <!-- 1. 등록 폼 -->
    <form id="todo-form">
      <input type="text" id="todo-title" placeholder="항목/할 일 제목 입력" required>
      <select id="todo-status-input">
        <option value="false">미완료 ⏳</option>
        <option value="true">완료 ✅</option>
      </select>
      <button type="submit">항목 추가</button>
    </form>

    <!-- 2. 필터 선택 -->
    <div style="margin-bottom: 15px;">
      <label><strong>보기 필터: </strong></label>
      <select id="todo-filter">
        <option value="all">전체 보기</option>
        <option value="false">미완료 목록만 ⏳</option>
        <option value="true">완료 목록만 ✅</option>
      </select>
    </div>

    <!-- 3. 목록 표시 영역 -->
    <div id="todo-list">
      <!-- 2번 게시판 목록이 그려지는 곳 -->
    </div>
  </div>

  <!-- ================= Firebase SDK 및 스크립트 로직 ================= -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { 
      getFirestore, 
      collection, 
      addDoc, 
      getDocs, 
      query, 
      orderBy, 
      serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    // 🔑 본인의 Firebase 설정값으로 변경하세요
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    // Firebase 초기화
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // XSS 방지 이스케이프 함수
    function escapeHtml(text) {
      return text ? text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") : '';
    }

    // ----------------------------------------------------
    // [1번 게시판 로직]
    // ----------------------------------------------------
    const postForm = document.getElementById('post-form');
    const titleInput = document.getElementById('post-title');
    const contentInput = document.getElementById('post-content');
    const postList = document.getElementById('post-list');

    async function loadPosts() {
      if (!postList) return;
      try {
        const q = query(collection(db, "posts"), orderBy("created_at", "desc"));
        const querySnapshot = await getDocs(q);

        postList.innerHTML = '';
        querySnapshot.forEach((doc) => {
          const data = doc.data();
          const date = data.created_at ? new Date(data.created_at.toDate()).toLocaleString() : '방금 전';

          const postElement = document.createElement('div');
          postElement.className = 'post-item';
          postElement.innerHTML = `
            <h3>${escapeHtml(data.title)}</h3>
            <p>${escapeHtml(data.content)}</p>
            <small>${date}</small>
          `;
          postList.appendChild(postElement);
        });

        if (postList.children.length === 0) {
          postList.innerHTML = '<p style="color: #888;">등록된 게시글이 없습니다.</p>';
        }
      } catch (error) {
        console.error("1번 게시판 불러오기 실패:", error);
      }
    }

    if (postForm) {
      postForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const title = titleInput.value.trim();
        const content = contentInput.value.trim();

        if (!title || !content) return alert("제목과 내용을 입력하세요.");

        try {
          await addDoc(collection(db, "posts"), {
            title: title,
            content: content,
            created_at: serverTimestamp()
          });
          titleInput.value = '';
          contentInput.value = '';
          await loadPosts();
        } catch (error) {
          console.error("1번 게시판 저장 실패:", error);
          alert("글 등록 실패: " + error.message);
        }
      });
    }

    // ----------------------------------------------------
    // [2번 게시판 (상태 관리) 로직]
    // ----------------------------------------------------
    const todoForm = document.getElementById('todo-form');
    const todoTitleInput = document.getElementById('todo-title');
    const todoStatusInput = document.getElementById('todo-status-input');
    const todoFilter = document.getElementById('todo-filter');
    const todoList = document.getElementById('todo-list');

    async function loadTodos() {
      if (!todoList) return;
      try {
        const q = query(collection(db, "todos"), orderBy("created_at", "desc"));
        const querySnapshot = await getDocs(q);

        todoList.innerHTML = '';
        const currentFilter = todoFilter ? todoFilter.value : 'all';

        querySnapshot.forEach((doc) => {
          const data = doc.data();
          const isCompleted = data.is_completed === true;

          // 필터링 적용
          if (currentFilter === 'true' && !isCompleted) return;
          if (currentFilter === 'false' && isCompleted) return;

          const date = data.created_at ? new Date(data.created_at.toDate()).toLocaleString() : '방금 전';

          const item = document.createElement('div');
          item.className = 'todo-item';
          item.style.backgroundColor = isCompleted ? '#e8f5e9' : '#fff3e0';
          item.style.borderLeft = `5px solid ${isCompleted ? '#2ecc71' : '#e67e22'}`;
          item.style.display = 'flex';
          item.style.justifyContent = 'space-between';
          item.style.alignItems = 'center';

          item.innerHTML = `
            <div>
              <span style="font-size: 1.05em; font-weight: bold; text-decoration: ${isCompleted ? 'line-through' : 'none'};">
                ${escapeHtml(data.title)}
              </span>
              <span class="todo-date" style="margin-left: 10px;">(${date})</span>
            </div>
            <div>
              <span class="badge ${isCompleted ? 'badge-complete' : 'badge-incomplete'}">
                ${isCompleted ? '완료 ✅' : '미완료 ⏳'}
              </span>
            </div>
          `;
          todoList.appendChild(item);
        });

        if (todoList.children.length === 0) {
          todoList.innerHTML = '<p style="color: #888;">등록된 항목이 없습니다.</p>';
        }
      } catch (error) {
        console.error("2번 게시판 불러오기 실패:", error);
      }
    }

    if (todoForm) {
      todoForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const title = todoTitleInput.value.trim();
        const isCompleted = todoStatusInput.value === 'true';

        if (!title) return alert("제목을 입력하세요.");

        try {
          await addDoc(collection(db, "todos"), {
            title: title,
            is_completed: isCompleted,
            created_at: serverTimestamp()
          });
          todoTitleInput.value = '';
          await loadTodos();
        } catch (error) {
          console.error("2번 게시판 저장 실패:", error);
          alert("항목 추가 실패: " + error.message);
        }
      });
    }

    if (todoFilter) {
      todoFilter.addEventListener('change', loadTodos);
    }

    // ----------------------------------------------------
    // [페이지 로드 완료 시 두 게시판 모두 불러오기]
    // ----------------------------------------------------
    window.addEventListener('DOMContentLoaded', () => {
      loadPosts();
      loadTodos();
    });
  </script>
</body>
</html>
