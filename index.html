<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>마감 기한 알림 & 타임테이블 매니저</title>
  <style>
    :root {
      --primary: #0066ff;
      --primary-hover: #0052cc;
      --bg: #f4f7fc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --border: #e2e8f0;
      --urgent: #ff3b30;
    }

    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    header h1 {
      color: var(--primary);
      margin-bottom: 6px;
      font-size: 1.8rem;
    }

    header p {
      color: #64748b;
      margin: 0;
      font-weight: 500;
    }

    /* 카드 스타일 */
    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 4px 20px rgba(0, 102, 255, 0.08);
      border: 1px solid rgba(0, 102, 255, 0.1);
      margin-bottom: 24px;
    }

    /* 입력창 (상단) */
    .input-section form {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .input-group {
      flex: 1;
      min-width: 240px;
    }

    .input-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: #475569;
    }

    input[type="text"], input[type="datetime-local"], textarea, select {
      width: 100%;
      padding: 12px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 0.95rem;
      transition: border-color 0.2s;
    }

    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: var(--primary);
    }

    .btn-submit {
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 12px 24px;
      font-weight: bold;
      cursor: pointer;
      align-self: flex-end;
      transition: background 0.2s;
      min-width: 140px;
      height: 46px;
    }

    .btn-submit:hover {
      background: var(--primary-hover);
    }

    /* 2단 출력창 (하단) */
    .output-section {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    @media (max-width: 768px) {
      .output-section {
        grid-template-columns: 1fr;
      }
    }

    .panel-title {
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--primary);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* 타임테이블 목록 */
    .timetable-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .timetable-item {
      padding: 12px 16px;
      border-left: 4px solid var(--primary);
      background: #f8fafc;
      margin-bottom: 10px;
      border-radius: 0 8px 8px 0;
    }

    .timetable-time {
      font-weight: bold;
      font-size: 0.85rem;
      color: var(--primary);
      margin-bottom: 4px;
    }

    .strategy-text {
      line-height: 1.6;
      white-space: pre-line;
      color: #334155;
    }

    /* 탭 메뉴 */
    .nav-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
      border-bottom: 2px solid var(--border);
    }

    .tab-btn {
      padding: 10px 20px;
      background: none;
      border: none;
      font-weight: bold;
      font-size: 1rem;
      color: #64748b;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      margin-bottom: -2px;
    }

    .tab-btn.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* 일정/게시판 목록 아이템 */
    .list-item {
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .list-item:hover {
      background: #f1f5f9;
    }

    .list-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .badge {
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: bold;
      color: white;
    }

    .badge-pending { background-color: var(--urgent); }
    .badge-done { background-color: #10b981; }

    .controls-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      gap: 10px;
      flex-wrap: wrap;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>🔥 마감 직전 활력 타임테이블</h1>
    <p>지금 바로 시작하세요! 시간을 조각내어 완벽하게 끝내드립니다.</p>
  </header>

  <!-- 1. 입력창 (상단) -->
  <div class="card input-section">
    <form id="task-form">
      <div class="input-group" style="flex: 2;">
        <label for="task-input">🔥 미루고 있는 작업</label>
        <input type="text" id="task-input" placeholder="예: 해커톤 Firebase 연동 완성하기" required>
      </div>
      <div class="input-group">
        <label for="deadline-input">⏰ 최종 마감 기한</label>
        <input type="datetime-local" id="deadline-input" required>
      </div>
      <button type="submit" class="btn-submit" id="gen-btn">🚀 바로 시작하기!</button>
    </form>
  </div>

  <!-- 2. 출력창 (하단 2분할: 왼쪽 타임테이블, 오른쪽 설명) -->
  <div class="output-section card" id="result-card" style="display: none;">
    <div>
      <div class="panel-title">⏳ 시간대별 마감 타임테이블</div>
      <ul class="timetable-list" id="timetable-output"></ul>
    </div>
    <div>
      <div class="panel-title">🎯 마감 돌파 전략 & 코칭</div>
      <div class="strategy-text" id="strategy-output"></div>
    </div>
  </div>

  <!-- 3. 하단 탭 (일정 조회 & 게시판) -->
  <div class="card">
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchTab('schedule-tab', event)">📅 등록된 일정 조회</button>
      <button class="tab-btn" onclick="switchTab('board-tab', event)">💬 커뮤니티 게시판</button>
    </div>

    <!-- [탭 1] 일정 조회 화면 -->
    <div id="schedule-tab" class="tab-content active">
      <div class="controls-bar">
        <div>
          <label>상태 구분: </label>
          <select id="schedule-status-filter" style="width: auto; display: inline-block;">
            <option value="all">전체 일정</option>
            <option value="pending">미완료 일정 ⏳</option>
            <option value="done">완료된 일정 ✅</option>
          </select>
        </div>
        <div>
          <label>정렬 순서: </label>
          <select id="schedule-sort" style="width: auto; display: inline-block;">
            <option value="created">등록 순서</option>
            <option value="deadline">마감 일자 순</option>
          </select>
        </div>
      </div>
      <div id="schedule-list"></div>
      <div id="schedule-detail" style="display:none; margin-top: 20px; padding: 16px; background: #eef6ff; border-radius: 8px;"></div>
    </div>

    <!-- [탭 2] 게시판 화면 -->
    <div id="board-tab" class="tab-content">
      <form id="board-form" style="margin-bottom: 20px;">
        <input type="text" id="board-title" placeholder="글 제목 입력" required style="margin-bottom: 10px;">
        <textarea id="board-content" placeholder="글 내용 입력..." required style="margin-bottom: 10px;"></textarea>
        <button type="submit" class="btn-submit" style="width: 100%;">게시글 작성</button>
      </form>
      <div class="panel-title">📜 최신 게시글 목록</div>
      <div id="board-list"></div>
    </div>
  </div>
</div>

<!-- Firebase SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { 
    getFirestore, collection, addDoc, getDocs, updateDoc, doc, query, orderBy, serverTimestamp 
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  // 🔑 전달해주신 Firebase 설정값 반영 완료
  const firebaseConfig = {
    apiKey: "AIzaSyBb2SQ1wQ5ToONqCVWGFIlGCdUyt0sgwn8",
    authDomain: "hacktest-20713.firebaseapp.com",
    projectId: "hacktest-20713",
    storageBucket: "hacktest-20713.firebasestorage.app",
    messagingSenderId: "259397480995",
    appId: "1:259397480995:web:290067a3cc0cae4aa13796"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // 브라우저 알림 권한 요청
  if ("Notification" in window && Notification.permission !== "granted") {
    Notification.requestPermission();
  }

  // --- Gemini 생성 및 저장 ---
  const taskForm = document.getElementById('task-form');
  const genBtn = document.getElementById('gen-btn');

  taskForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const task = document.getElementById('task-input').value.trim();
    const deadline = document.getElementById('deadline-input').value;

    genBtn.disabled = true;
    genBtn.innerText = "타임테이블 생성 중...";

    try {
      const res = await fetch('/api/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ task, deadline })
      });

      const data = await res.json();
      if (!res.ok) throw new Error(data.error);

      // 화면 출력 (왼쪽: 타임테이블, 오른쪽: 전략)
      renderOutput(data.timetable, data.strategy);

      // Firestore 저장
      await addDoc(collection(db, "schedules"), {
        task,
        deadline,
        timetable: data.timetable,
        strategy: data.strategy,
        is_done: false,
        created_at: serverTimestamp()
      });

      // 알림 등록
      scheduleNotifications(task, data.timetable);

      loadSchedules(); // 목록 갱신
      alert("타임테이블이 성공적으로 생성되고 저장되었습니다!");

    } catch (err) {
      console.error("생성 오류:", err);
      alert("오류 발생: " + err.message);
    } finally {
      // 💡 무조건 버튼 상태를 원상복구시켜 '타임테이블 생성 중...'에서 풀려나게 함
      genBtn.disabled = false;
      genBtn.innerText = "🚀 바로 시작하기!";
    }
  });

  function renderOutput(timetable, strategy) {
    const timetableOutput = document.getElementById('timetable-output');
    timetableOutput.innerHTML = timetable.map(item => `
      <li class="timetable-item">
        <div class="timetable-time">⏰ ${item.time}</div>
        <div>${item.action}</div>
      </li>
    `).join('');

    document.getElementById('strategy-output').innerText = strategy;
    document.getElementById('result-card').style.display = 'grid';
  }

  function scheduleNotifications(taskName, timetable) {
    if ("Notification" in window && Notification.permission === "granted") {
      new Notification(`[마감 시작] ${taskName}`, {
        body: "계획된 타임테이블에 맞춰 진행해 주세요!"
      });
    }
  }

  // --- 일정 조회 관련 기능 ---
  let allSchedules = [];

  async function loadSchedules() {
    const listEl = document.getElementById('schedule-list');
    try {
      const q = query(collection(db, "schedules"));
      const snapshot = await getDocs(q);
      allSchedules = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      renderSchedules();
    } catch (e) {
      console.error("일정 로드 실패:", e);
    }
  }

  function renderSchedules() {
    const statusFilter = document.getElementById('schedule-status-filter').value;
    const sortFilter = document.getElementById('schedule-sort').value;
    const listEl = document.getElementById('schedule-list');

    let filtered = allSchedules.filter(item => {
      if (statusFilter === 'pending') return !item.is_done;
      if (statusFilter === 'done') return item.is_done;
      return true;
    });

    filtered.sort((a, b) => {
      if (sortFilter === 'deadline') {
        return new Date(a.deadline) - new Date(b.deadline);
      }
      return (b.created_at?.toMillis() || 0) - (a.created_at?.toMillis() || 0);
    });

    listEl.innerHTML = filtered.map(item => `
      <div class="list-item" onclick="showScheduleDetail('${item.id}')">
        <div class="list-header">
          <strong>${item.task}</strong>
          <span class="badge ${item.is_done ? 'badge-done' : 'badge-pending'}">
            ${item.is_done ? '완료 ✅' : '미완료 ⏳'}
          </span>
        </div>
        <small style="color: #64748b;">⏰ 마감: ${new Date(item.deadline).toLocaleString()}</small>
      </div>
    `).join('') || '<p style="color:#888;">조회된 일정이 없습니다.</p>';
  }

  window.showScheduleDetail = (id) => {
    const item = allSchedules.find(s => s.id === id);
    if (!item) return;

    const detailEl = document.getElementById('schedule-detail');
    detailEl.style.display = 'block';
    detailEl.innerHTML = `
      <h3>📌 ${item.task}</h3>
      <p><strong>마감기한:</strong> ${new Date(item.deadline).toLocaleString()}</p>
      <p><strong>전략:</strong> ${item.strategy}</p>
      <button class="btn-submit" onclick="toggleComplete('${item.id}', ${!item.is_done})">
        ${item.is_done ? '미완료로 변경' : '완료 처리하기'}
      </button>
    `;

    renderOutput(item.timetable, item.strategy);
  };

  window.toggleComplete = async (id, status) => {
    await updateDoc(doc(db, "schedules", id), { is_done: status });
    document.getElementById('schedule-detail').style.display = 'none';
    await loadSchedules();
  };

  document.getElementById('schedule-status-filter').addEventListener('change', renderSchedules);
  document.getElementById('schedule-sort').addEventListener('change', renderSchedules);

  // --- 게시판 기능 ---
  const boardForm = document.getElementById('board-form');

  async function loadBoard() {
    const boardList = document.getElementById('board-list');
    try {
      const q = query(collection(db, "posts"), orderBy("created_at", "desc"));
      const snapshot = await getDocs(q);

      boardList.innerHTML = snapshot.docs.map(doc => {
        const data = doc.data();
        const date = data.created_at ? new Date(data.created_at.toDate()).toLocaleString() : '방금 전';
        return `
          <div class="list-item" style="cursor:default;">
            <div class="list-header">
              <strong>${data.title}</strong>
              <small style="color: #64748b;">${date}</small>
            </div>
            <p style="margin: 6px 0 0 0; color: #334155;">${data.content}</p>
          </div>
        `;
      }).join('') || '<p style="color:#888;">등록된 게시글이 없습니다.</p>';
    } catch (e) {
      console.error("게시판 로드 실패:", e);
    }
  }

  boardForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const title = document.getElementById('board-title').value.trim();
    const content = document.getElementById('board-content').value.trim();

    try {
      await addDoc(collection(db, "posts"), {
        title,
        content,
        created_at: serverTimestamp()
      });
      document.getElementById('board-title').value = '';
      document.getElementById('board-content').value = '';
      await loadBoard();
    } catch (e) {
      alert("글 작성 실패: " + e.message);
    }
  });

  // 탭 전환 함수
  window.switchTab = (tabId, evt) => {
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

    evt.currentTarget.classList.add('active');
    document.getElementById(tabId).classList.add('active');
  };

  // 초기 로드
  window.addEventListener('DOMContentLoaded', () => {
    loadSchedules();
    loadBoard();
  });
</script>
</body>
</html>
